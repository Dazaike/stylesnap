<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font: 13px sans-serif; margin: 0; padding: 12px; width: 220px; }
    button {
      width: 100%; padding: 8px; font-size: 13px; cursor: pointer;
      background: #ff5252; color: #fff; border: none; border-radius: 4px;
    }
    button:hover { background: #e64545; }
    p { color: #666; margin: 8px 0 0; font-size: 11px; }
  </style>
</head>
<body>
  <button id="launch">Pick an element</button>
  <p>Click the button, then click any element on the page to extract its HTML, CSS, and computed styles.</p>
  <script src="popup.js"></script>
</body>
</html>
