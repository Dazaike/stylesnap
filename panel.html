<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      font: 12px monospace; margin: 0; background: #1e1e1e; color: #ddd;
      display: flex; flex-direction: column; height: 100vh;
    }
    #toolbar {
      display: flex; gap: 4px; padding: 6px; background: #2a2a2a;
      border-bottom: 1px solid #3a3a3a; flex-wrap: wrap;
    }
    button {
      background: #333; color: #ddd; border: 1px solid #444; border-radius: 3px;
      padding: 4px 10px; cursor: pointer; font: 12px monospace;
    }
    button:hover { background: #444; }
    button.active { background: #ff5252; border-color: #ff5252; color: #fff; }
    #copyAll { margin-left: auto; background: #2d6a4f; border-color: #2d6a4f; }
    #copyAll:hover { background: #36805f; }
    #content { flex: 1; overflow: auto; padding: 10px; white-space: pre-wrap; word-break: break-all; }
    #empty { color: #888; padding: 20px; }
  </style>
</head>
<body>
  <div id="toolbar">
    <button data-tab="identity" class="active">Identity</button>
    <button data-tab="html">HTML</button>
    <button data-tab="computedStyles">Computed Styles</button>
    <button data-tab="matchedRules">Stylesheet Rules</button>
    <button data-tab="cssVariables">CSS Variables</button>
    <button data-tab="layout">Layout</button>
    <button data-tab="fonts">Fonts</button>
    <button id="copyAll">Copy All</button>
  </div>
  <div id="content"><div id="empty">Click the extension icon, then pick an element on the page.</div></div>
  <script src="panel.js"></script>
</body>
</html>
